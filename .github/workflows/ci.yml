name: Slonyara CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVE_SDK_VERSION: "0.9.3"

jobs:
  check:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install Native SDK
        run: |
          npm install --global "@native-sdk/cli@$NATIVE_SDK_VERSION"
          export NATIVE_SDK_PATH="$(npm root --global)/@native-sdk/cli"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'build.zig.zon';
          const source = readFileSync(file, 'utf8');
          const dependency = /(\.native_sdk\s*=\s*\.\{\s*\.path\s*=\s*)"[^"]+"/;
          if (!dependency.test(source)) throw new Error('Native SDK dependency not found');
          writeFileSync(file, source.replace(dependency, (_, prefix) => prefix + JSON.stringify(process.env.NATIVE_SDK_PATH)));
          NODE

      - name: Checkout zsort 0.7.0
        uses: actions/checkout@v4
        with:
          repository: mstdokumaci/zsort
          ref: 11086049fd1272110297ee1af852775728bdb736
          path: .ci-tools/zsort
          persist-credentials: false

      - name: Install zsort
        run: |
          zig build --build-file .ci-tools/zsort/build.zig -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/zsort"
          echo "$RUNNER_TEMP/zsort/bin" >> "$GITHUB_PATH"

      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb

      - name: Run pre-commit checks
        run: ./scripts/pre-commit

      - name: Build UI with automation
        run: zig build -Dautomation=true

      - name: Check Intro in a virtual display
        run: |
          xvfb-run --auto-servernum bash -euo pipefail <<'SMOKE'
          ./zig-out/bin/slonyara > /tmp/slonyara-ui-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" >/dev/null 2>&1 || true' EXIT
          native automate wait
          native automate assert 'dispatch_errors=0' 'intro-canvas' '640x480' 'gpu_status=ready' 'role=button name="New Connection"' 'name="No connections yet"'
          native automate screenshot intro-canvas
          test -s .zig-cache/native-sdk-automation/screenshot-intro-canvas.png
          SMOKE

      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intro-ui-diagnostics
          path: |
            .zig-cache/native-sdk-automation/screenshot-intro-canvas.png
            .zig-cache/native-sdk-automation/snapshot.txt
            /tmp/slonyara-ui-smoke.log
          if-no-files-found: ignore
          include-hidden-files: true
