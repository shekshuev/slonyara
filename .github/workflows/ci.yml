name: Slonyara CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVE_SDK_VERSION: "0.9.3"

jobs:
  check:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout zsort 0.7.0
        uses: actions/checkout@v4
        with:
          repository: mstdokumaci/zsort
          ref: 11086049fd1272110297ee1af852775728bdb736
          path: .ci-tools/zsort
          persist-credentials: false

      - name: Install zsort
        run: |
          zig build --build-file .ci-tools/zsort/build.zig -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/zsort"
          echo "$RUNNER_TEMP/zsort/bin" >> "$GITHUB_PATH"

      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb

      - name: Build UI with automation
        run: zig build -Dautomation=true

      - name: Check Code Format
        run: zig fmt --check src

      - name: Check Imports
        run: zsort check src

      - name: Run Test
        run: xvfb-run --auto-servernum zig build test --summary all
